
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="登登乐园">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>登登的学习成长乐园</title>
<style>
:root{
  --bg1:#fff6ef; --bg2:#f2f7ff; --bg3:#fdf1f7;
  --card:#ffffff; --card2:#fbfaff;
  --ink:#40384f; --ink2:#6b6480; --muted:#9a94ab;
  --line:#efe9f4;
  --pink:#ff9db4; --pink-d:#f5748f;
  --blue:#79c6e8; --blue-d:#4aa8d3;
  --green:#8ed6a0; --green-d:#5cb875;
  --yellow:#ffcf6b; --yellow-d:#f0ab2e;
  --purple:#b7a6ec; --purple-d:#8f79dd;
  --orange:#ffb27a;
  --red:#ff8f8f;
  --shadow:0 6px 18px rgba(120,100,160,.10);
  --shadow2:0 12px 34px rgba(120,100,160,.18);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); background:
    radial-gradient(1000px 600px at 8% -8%, #ffe9f1 0%, transparent 60%),
    radial-gradient(900px 620px at 100% 0%, #e6f3ff 0%, transparent 62%),
    radial-gradient(900px 700px at 50% 110%, #eafbf0 0%, transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed; min-height:100vh;
  font-size:15px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.app{max-width:1180px;margin:0 auto;padding:14px 14px 90px}
/* ---------- header ---------- */
header.top{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(120deg,#fff 0%,#fff9fc 60%,#f4faff 100%);
  border:2px solid #fff;border-radius:26px;padding:14px 18px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
header.top:before{content:"";position:absolute;inset:0;background:
  radial-gradient(300px 120px at 12% 0%,rgba(255,157,180,.20),transparent 70%),
  radial-gradient(300px 140px at 88% 100%,rgba(121,198,232,.22),transparent 70%);}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.brand .logo{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:28px;
  background:linear-gradient(140deg,#ffd7e4,#ffeccf 60%,#d9f0ff);box-shadow:inset 0 0 0 2px #fff, var(--shadow)}
.brand h1{margin:0;font-size:22px;letter-spacing:.5px}
.brand .sub{font-size:12px;color:var(--muted);margin-top:-2px}
.spacer{flex:1}
.hdr-right{display:flex;align-items:center;gap:8px;position:relative;z-index:1;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);
  border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap
}
.pill.coin{background:linear-gradient(120deg,#fff3d0,#ffe7b5);border-color:#ffe0a0;color:#8a6412}
.pill.role-parent{background:linear-gradient(120deg,#e9e2ff,#f4efff);border-color:#ddd0ff;color:#5c46a8}
.pill.role-child{background:linear-gradient(120deg,#dff5e6,#effbf2);border-color:#cbeed6;color:#2f7a48}
/* ---------- nav ---------- */
nav.mainnav{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.mainnav::-webkit-scrollbar{display:none}
nav.mainnav button{
  flex:0 0 auto;border:2px solid #fff;background:#ffffffcc;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border-radius:999px;padding:10px 16px;font-size:14px;font-weight:700;color:var(--ink2);
  box-shadow:var(--shadow);cursor:pointer;min-height:44px;transition:.16s;font-family:inherit
}
nav.mainnav button.active{background:linear-gradient(120deg,var(--pink),#ffb9c8);color:#fff;border-color:#fff;box-shadow:var(--shadow2);transform:translateY(-1px)}
nav.mainnav button.parent-only{background:linear-gradient(120deg,#efe8ff,#f8f4ff);color:#6a55b8}
nav.mainnav button.parent-only.active{background:linear-gradient(120deg,var(--purple),#c9bbf5);color:#fff}
/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.card{background:var(--card);border:2px solid #fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.soft{background:linear-gradient(150deg,#fff,#fdfbff)}
.card h2,.card h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.card h3{font-size:15px}
.sec-title{display:flex;align-items:center;gap:10px;margin:20px 4px 10px;font-size:18px;font-weight:800}
.sec-title .em{font-size:22px}
.hint{font-size:12px;color:var(--muted);line-height:1.55}
.divider{height:2px;background:var(--line);border-radius:2px;margin:12px 0}
/* ---------- stat tiles ---------- */
.tile{border-radius:var(--r);padding:16px;color:#4a4059;position:relative;overflow:hidden;border:2px solid #fff;box-shadow:var(--shadow)}
.tile .lab{font-size:12.5px;opacity:.85;font-weight:700}
.tile .val{font-size:27px;font-weight:900;line-height:1.2;margin-top:4px}
.tile .sub{font-size:11.5px;opacity:.8;margin-top:2px}
.tile .em{position:absolute;right:10px;bottom:6px;font-size:44px;opacity:.24}
.t-pink{background:linear-gradient(140deg,#ffe3ec,#fff2f6)}
.t-blue{background:linear-gradient(140deg,#dcefff,#f0f8ff)}
.t-green{background:linear-gradient(140deg,#dcf6e4,#f0fbf4)}
.t-yellow{background:linear-gradient(140deg,#fff0cc,#fff9e8)}
.t-purple{background:linear-gradient(140deg,#eae2ff,#f6f2ff)}
.t-orange{background:linear-gradient(140deg,#ffe6d2,#fff5ec)}
/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;
  border-radius:14px;padding:10px 15px;font-size:14px;font-weight:800;font-family:inherit;
  background:linear-gradient(120deg,var(--pink),#ffb6c6);color:#fff;box-shadow:0 4px 12px rgba(245,116,143,.30);
  min-height:42px;transition:.15s
}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;filter:grayscale(.4)}
.btn.b{background:linear-gradient(120deg,var(--blue),#a6ddf3);box-shadow:0 4px 12px rgba(74,168,211,.28)}
.btn.g{background:linear-gradient(120deg,var(--green),#b3e8c1);box-shadow:0 4px 12px rgba(92,184,117,.28)}
.btn.y{background:linear-gradient(120deg,var(--yellow),#ffe3a8);color:#7a5510;box-shadow:0 4px 12px rgba(240,171,46,.28)}
.btn.p{background:linear-gradient(120deg,var(--purple),#d3c7f7);box-shadow:0 4px 12px rgba(143,121,221,.28)}
.btn.r{background:linear-gradient(120deg,var(--red),#ffb8b8);box-shadow:0 4px 12px rgba(255,143,143,.30)}
.btn.ghost{background:#fff;color:var(--ink2);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12.5px;min-height:34px;border-radius:11px}
.btn.xs{padding:4px 9px;font-size:11.5px;min-height:28px;border-radius:9px}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- forms ---------- */
label.f{display:block;margin:10px 0 0}
label.f>span{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}
input,select,textarea{
  width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:#fcfbff;
  border:2px solid var(--line);border-radius:13px;padding:10px 12px;outline:none;min-height:44px
}
textarea{min-height:82px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:#fff}
input[type=checkbox]{width:22px;height:22px;min-height:22px;vertical-align:middle;accent-color:var(--pink)}
.chkline{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-top:10px}
.wdays{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.wdays label{display:inline-flex;align-items:center;gap:5px;background:#fbfaff;border:2px solid var(--line);
  border-radius:11px;padding:7px 10px;font-size:13px;font-weight:700;cursor:pointer}
.wdays input{width:18px;height:18px;min-height:18px}
/* ---------- lists / rows ---------- */
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:2px solid var(--line);border-radius:15px;background:#fdfcff;margin-bottom:9px;flex-wrap:wrap}
.row .grow{flex:1;min-width:150px}
.row .nm{font-weight:800;font-size:14.5px}
.row .mt{font-size:12px;color:var(--muted)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.b-todo{background:#f1eef8;color:#736b8a}
.b-wait{background:#fff1d3;color:#96690d}
.b-ok{background:#ddf5e4;color:#2f7a48}
.b-part{background:#ffe6d6;color:#a35a18}
.b-no{background:#ffe1e1;color:#a34141}
.b-leave{background:#e2eeff;color:#3a6ea8}
.b-exp{background:#ecebef;color:#8b869c}
.b-course{background:#e7e0ff;color:#5c46a8}
.b-daily{background:#dff1ff;color:#2f6f96}
.b-adhoc{background:#ffe6f0;color:#a63f65}
/* ---------- progress ---------- */
.bar{height:12px;border-radius:99px;background:#f0edf6;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#bdeccb);transition:width .5s}
.bar.warn>i{background:linear-gradient(90deg,var(--yellow),#ffe4ad)}
.bar.dang>i{background:linear-gradient(90deg,var(--red),#ffc4c4)}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;
  font-size:13px;font-weight:800;color:var(--ink2);cursor:pointer;min-height:40px;font-family:inherit}
.tabs button.active{background:linear-gradient(120deg,var(--blue),#a9def4);color:#fff;border-color:#fff}
/* ---------- pets ---------- */
.pet{border-radius:var(--r);padding:16px;text-align:center;border:2px solid #fff;box-shadow:var(--shadow);
  background:linear-gradient(150deg,#fff,#fdf7ff);position:relative}
.pet .ava{font-size:56px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
.pet .cos{font-size:20px;margin-left:-6px}
.pet .nm{font-weight:900;margin-top:6px;font-size:16px}
.pet .lv{font-size:12px;color:var(--muted)}
.pet.empty{background:repeating-linear-gradient(45deg,#fdfbff,#fdfbff 10px,#f7f3fb 10px,#f7f3fb 20px);border:2px dashed #e2dcec}
/* ---------- honors ---------- */
.medal{border-radius:18px;padding:14px 10px;text-align:center;border:2px solid #fff;box-shadow:var(--shadow);position:relative}
.medal .ic{font-size:40px;line-height:1.1}
.medal .nm{font-weight:900;font-size:13.5px;margin-top:4px}
.medal .ds{font-size:11px;color:var(--muted);margin-top:2px}
.medal.locked{filter:grayscale(1);opacity:.5;background:#faf9fc}
.medal.cert{background:linear-gradient(150deg,#fff6e0,#fffdf6)}
.medal.trophy{background:linear-gradient(150deg,#ffeef4,#fff8fb)}
/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(60,50,80,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:80;
  display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal{background:#fff;border-radius:24px;width:100%;max-width:560px;box-shadow:var(--shadow2);
  margin:auto;border:3px solid #fff;overflow:hidden;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal .mh{padding:16px 18px;font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(120deg,#fff2f6,#f2f9ff)}
.modal .mb{padding:16px 18px;max-height:66vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal .mf{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:2px solid var(--line)}
/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#463c58;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;
  box-shadow:var(--shadow2);animation:up .25s ease;max-width:88vw}
.toast.ok{background:linear-gradient(120deg,#5cb875,#7fcf94)}
.toast.err{background:linear-gradient(120deg,#e5747a,#f39a9a)}
.toast.coin{background:linear-gradient(120deg,#f0ab2e,#ffcd6b);color:#4d3506}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
/* ---------- misc ---------- */
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border:none}
.kv b{font-weight:800}
.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:13.5px}
.empty .em{font-size:38px;display:block;margin-bottom:6px;opacity:.7}
.mini{font-size:12px;color:var(--muted)}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.scrollbox{max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px}
.matlink{display:inline-flex;align-items:center;gap:5px;background:#eef6ff;border:2px solid #ddebfa;color:#2f6f96;
  border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;text-decoration:none;margin:3px 4px 0 0}
.battle-stage{text-align:center;padding:22px 10px;border-radius:var(--r);
  background:linear-gradient(150deg,#f6efff,#eef7ff);border:2px dashed #e0d6f2}
.battle-stage .vs{font-size:52px;letter-spacing:6px}
.shake{animation:sh .5s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:24px 8px 6px}
@media (max-width:520px){
  .app{padding:10px 10px 80px}
  .brand h1{font-size:18px}
  .tile .val{font-size:23px}
}
@media print{nav.mainnav,.btn,.bottomnav{display:none}}
/* ---------- 底部固定导航（移动端） ---------- */
.bottomnav{position:fixed;bottom:0;left:0;right:0;display:none;justify-content:space-around;align-items:center;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:100;box-shadow:0 -4px 16px rgba(120,100,160,.08)}
.bottomnav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;font-size:10px;color:var(--muted);cursor:pointer;flex:1;min-width:0}
.bottomnav button .bn-emoji{font-size:22px;line-height:1;transition:transform .2s}
.bottomnav button.active{color:var(--pink-d)}
.bottomnav button.active .bn-emoji{transform:translateY(-2px) scale(1.1)}
@media (max-width:768px){.bottomnav{display:flex}.app{padding-bottom:calc(90px + env(safe-area-inset-bottom))}}
/* ---------- 童趣弹窗 / 撒花 / 图表 ---------- */
.celebrate{position:relative;text-align:center;padding:8px 4px 4px;overflow:hidden;min-height:120px}
.celebrate .big-emoji{font-size:72px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
.celebrate .big-emoji.pop{animation:cpop .5s ease}
@keyframes cpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.celebrate .ctitle{font-size:22px;font-weight:900;margin-top:6px}
.celebrate .cmsg{font-size:14.5px;line-height:1.7;margin-top:6px;color:var(--ink2)}
.celebrate .creward{display:inline-block;margin-top:10px;background:linear-gradient(120deg,#fff3d0,#ffe7b5);color:#8a6412;
  font-weight:900;font-size:18px;padding:8px 18px;border-radius:999px;border:2px solid #ffe0a0}
.celebrate .chint{font-size:12.5px;color:var(--muted);margin-top:10px}
.confetti{position:absolute;top:-12px;font-size:20px;opacity:.9;animation:fall 2.4s linear infinite;pointer-events:none}
@keyframes fall{0%{transform:translateY(-12px) rotate(0);opacity:0}12%{opacity:1}100%{transform:translateY(240px) rotate(220deg);opacity:0}}
@keyframes floatUp{0%{transform:translateX(50%) translateY(0);opacity:0}20%{opacity:1}100%{transform:translateX(50%) translateY(-50px);opacity:0}}
.wk-bars{display:flex;gap:6px;align-items:flex-end;justify-content:center;height:170px;padding:10px 4px 2px}
.wk-bar{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.wk-col{width:62%;max-width:36px;height:120px;background:#f0edf6;border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wk-col>i{width:100%;background:linear-gradient(180deg,#8ed6a0,#79c6e8);border-radius:8px;transition:height .5s}
.wk-lab{font-size:11px;color:var(--muted);margin-top:5px}
.wk-num{font-size:10.5px;color:var(--ink2);font-weight:700;margin-top:1px;white-space:nowrap}
@media (max-width:520px){ .wk-col{height:92px} .wk-bars{height:142px} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">🌈</div>
      <div>
        <h1>登登的学习成长乐园</h1>
        <div class="sub" id="subTitle">今天也要元气满满哦 ~</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="hdr-right">
      <span class="pill coin">⭐ <span id="hdrPoints">0</span> 积分</span>
      <span class="pill" id="hdrDate">—</span>
      <span class="pill role-child" id="hdrRole" data-act="toggleRole" style="cursor:pointer">👦 孩子端</span>
    </div>
  </header>
  <nav class="mainnav" id="nav"></nav>
  <main id="view"></main>
  <div class="foot">数据全部保存在本机浏览器中 · 请定期到「存档管理」导出 JSON 备份 · v1.0</div>
</div>
<nav class="bottomnav" id="bottomNav"></nav>
<div id="modalRoot"></div>
<div id="toasts"></div>
<script>
/* =========================================================
   登登的学习成长乐园  ——  核心数据层
   ========================================================= */
var LS_KEY = 'dengdeng_growth_park_v1';
var WD = ['周日','周一','周二','周三','周四','周五','周六'];

function uid(p){ return (p||'id') + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).length<2 ? '0'+n : ''+n; }
function dstr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return dstr(new Date()); }
function parseD(s){ return new Date(s+'T00:00:00'); }
function addDays(s,n){ var d=parseD(s); d.setDate(d.getDate()+n); return dstr(d); }
function monthKey(s){ return s.slice(0,7); }
function weekKey(s){ var d=parseD(s); var w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return dstr(d); }
function nowStr(){ var d=new Date(); return dstr(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function num(v,dft){ var n=parseFloat(v); return isNaN(n)?(dft||0):n; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function cycleKeyOf(dateStr){ var d=parseD(dateStr); var y=d.getFullYear(); return (d.getMonth()>=7? y : y-1); }
function cycleStartOf(dateStr){ return cycleKeyOf(dateStr)+'-08-01'; }

/* ---------------- 默认存档 ---------------- */
function defaultState(){
  var t = today();
  return {
    meta:{ app:'登登的学习成长乐园', version:1, createdAt:t, savedAt:'' },
    profile:{ childName:'登登', childEmoji:'👦', motto:'每天进步一点点' },
    role:'child',
    bedtime:{ shownDate:'' },
    weeklyReports:[],
    points:0,
    settings:{
      parentPin:'1234',
      pointName:'积分',
      coursePoints:5,
      dailyPointsPool:[2,3,4],

/* ---------------- 读写存档 ---------------- */
var state = null;
function deepFill(target, dft){
  for(var k in dft){
    if(!Object.prototype.hasOwnProperty.call(dft,k)) continue;
    if(target[k]===undefined || target[k]===null){ target[k]=clone(dft[k]); }
    else if(typeof dft[k]==='object' && !Array.isArray(dft[k]) && typeof target[k]==='object' && !Array.isArray(target[k])){
      deepFill(target[k], dft[k]);
    }
  }
  return target;
}
function load(){
  var raw=null;
  try{ raw=localStorage.getItem(LS_KEY); }catch(e){}
  if(raw){
    try{ state = deepFill(JSON.parse(raw), defaultState()); }
    catch(e){ state = defaultState(); }
  } else { state = defaultState(); }
}
function save(){
  state.meta.savedAt = nowStr();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast('保存失败：浏览器存储空间不足，请精简学习素材附件','err'); }
}
function S(){ return state.settings; }
function PN(){ return state.settings.pointName || '积分'; }
function isParent(){ return state.role==='parent'; }

/* ---------------- 通用 UI ---------------- */
function toast(msg, kind){
  var box=document.getElementById('toasts');
  var d=document.createElement('div');
  d.className='toast '+(kind||'');
  d.textContent=msg; box.appendChild(d);
  /* 音效反馈 */
  if(kind==='ok') sfx('ok');
  else if(kind==='err') sfx('err');
  else if(kind==='coin') sfx('coin');
  setTimeout(function(){ d.style.transition='.3s'; d.style.opacity='0'; d.style.transform='translateY(-8px)';
    setTimeout(function(){ d.remove(); },320); }, 2200);
}
/* ---------------- 音效系统（Web Audio API，无需外部文件） ---------------- */
var _ac=null;
function sfx(type){
  try{
    if(!state.settings.soundEnabled) return;
    if(!_ac) _ac=new (window.AudioContext||window.webkitAudioContext)();
    var ac=_ac; if(ac.state==='suspended') ac.resume();
    var now=ac.currentTime;
    function tone(freq, start, dur, vol, type){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type=type||'sine'; o.frequency.value=freq;
      o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0, now+start);
      g.gain.linearRampToValueAtTime(vol||0.15, now+start+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now+start+dur);
      o.start(now+start); o.stop(now+start+dur+0.05);
    }
    if(type==='ok'){ tone(523,0,0.15,0.12,'sine'); tone(659,0.08,0.15,0.12,'sine'); tone(784,0.16,0.2,0.12,'sine'); }
    else if(type==='err'){ tone(300,0,0.12,0.1,'square'); tone(200,0.1,0.15,0.1,'square'); }
    else if(type==='coin'){ tone(880,0,0.08,0.1,'square'); tone(1320,0.06,0.12,0.1,'square'); }
    else if(type==='levelup'){ tone(523,0,0.1,0.12); tone(659,0.08,0.1,0.12); tone(784,0.16,0.1,0.12); tone(1047,0.24,0.2,0.14); }
    else if(type==='battle'){ tone(150,0,0.1,0.12,'sawtooth'); tone(100,0.08,0.2,0.1,'sawtooth'); }
    else if(type==='celebrate'){ tone(523,0,0.1,0.1); tone(659,0.1,0.1,0.1); tone(784,0.2,0.1,0.1); tone(1047,0.3,0.25,0.13); }
  }catch(e){}
}

/* ---------------- 积分与流水 ---------------- */
function addPoints(delta, reason, kind){
  delta = Math.round(delta);
  state.points = Math.max(0, state.points + delta);
  state.ledger.unshift({ id:uid('lg'), ts:nowStr(), date:today(), delta:delta, reason:reason, kind:kind||'其他', balance:state.points });
  if(state.ledger.length>1200) state.ledger.length=1200;
  animatePoints(delta);
}
/* 积分数字滚动动画 + 浮动提示 */
function animatePoints(delta){
  var el=document.getElementById('hdrPoints');
  if(!el) return;
  var from=parseInt(el.textContent)||0;
  var to=state.points;
  if(from===to) return;
  var start=Date.now(), dur=600;
  function tick(){
    var t=Math.min(1,(Date.now()-start)/dur);
    var v=Math.round(from+(to-from)*(1-Math.pow(1-t,3)));
    el.textContent=v;
    if(t<1) requestAnimationFrame(tick);
    else el.textContent=to;
  }
  tick();
  el.style.transform='scale(1.3)';
  el.style.transition='transform 0.3s';
  setTimeout(function(){ el.style.transform='scale(1)'; },300);
  if(delta>0) sfx('coin');
  /* 浮动 +N / -N 提示 */
  if(delta!==0){
    var f=document.createElement('div');
    f.textContent=(delta>0?'+':'')+delta;
    f.style.cssText='position:fixed;top:18px;right:50%;transform:translateX(50%);font-size:22px;font-weight:900;color:'+(delta>0?'#5cb875':'#ff6b6b')+';z-index:9999;pointer-events:none;animation:floatUp 1.2s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.15)';
    document.body.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },1200);
  }
}
function totalEarned(){
  var s=0; state.ledger.forEach(function(l){ if(l.delta>0) s+=l.delta; }); return s;
}
function logIt(o){
  o.ts = nowStr();
  state.logs.unshift(o);
  if(state.logs.length>4000) state.logs.length=4000;

/* ---------------- 任务计算 ---------------- */
function tasksForDate(ds){
  var wd = parseD(ds).getDay(), out=[];
  state.courses.forEach(function(c){
    if(!c.enabled) return;
    (c.slots||[]).forEach(function(s,i){
      if(Number(s.weekday)===wd){
        out.push({ key:'c:'+c.id+':'+i, type:'course', typeName:'固定课程', ref:c.id, name:c.name, emoji:c.emoji||'📘',
          time:s.time||'', window:c.window||'', note:c.note||'', materials:c.materials||[],
          points:(c.points==null? S().coursePoints : c.points), pointsText:(c.points==null? S().coursePoints : c.points)+' '+PN() });
      }
    });
  });
  state.dailyTasks.forEach(function(t){
    if(!t.enabled) return;
    if((t.blockedWeekdays||[]).indexOf(wd)>=0) return;
    out.push({ key:'d:'+t.id, type:'daily', typeName:'自主任务', ref:t.id, name:t.name, emoji:t.emoji||'⭐',
      time:'', window:t.window||'', note:t.note||'', materials:t.materials||[],
      points:(t.points==null? null : t.points),
      pointsText:(t.points==null? (S().dailyPointsPool.join('/')+' 随机') : t.points+' ')+PN() });
  });
  state.adhoc.forEach(function(a){
    if(a.date!==ds) return;
    out.push({ key:'a:'+a.id, type:'adhoc', typeName:'临时任务', ref:a.id, name:a.name, emoji:a.emoji||'📌',
      time:a.time||'', window:a.window||'', note:a.note||'', materials:a.materials||[],
      due:a.due||'', points:(a.points==null? S().adhocDefaultPoints : a.points),
      pointsText:(a.points==null? S().adhocDefaultPoints : a.points)+' '+PN() });
  });
  return out;
}
function blockedInfoForDate(ds){
  var wd=parseD(ds).getDay(), arr=[];
  state.dailyTasks.forEach(function(t){
    if(t.enabled && (t.blockedWeekdays||[]).indexOf(wd)>=0) arr.push(t.name);
  });
  return arr;
}
function rec(ds, key){
  if(!state.records[ds]) return null;
  return state.records[ds][key]||null;
}
function setRec(ds, key, obj){
  if(!state.records[ds]) state.records[ds]={};
  state.records[ds][key]=obj;
}
function isLeave(ds){ return !!state.leaves[ds]; }
function statusOf(ds, key){
  if(isLeave(ds)) return 'leave';
  var r=rec(ds,key);
  if(r) return r.status;
  if(ds < today()) return 'expired';
  return 'todo';
}
var ST_TEXT={ todo:'待打卡', submitted:'待家长审核', approved:'已通过', partial:'部分完成', rejected:'未通过', leave:'请假', expired:'已超时' };
var ST_CLASS={ todo:'b-todo', submitted:'b-wait', approved:'b-ok', partial:'b-part', rejected:'b-no', leave:'b-leave', expired:'b-exp' };

function dayComplete(ds){
  if(isLeave(ds)) return S().leaveKeepsStreak ? 'leave' : false;
  var list=tasksForDate(ds);
  if(!list.length) return 'none';
  for(var i=0;i<list.length;i++){ if(statusOf(ds,list[i].key)!=='approved') return false; }
  return true;
}
function currentStreak(endDate){
  var d = endDate||today(), n=0, guard=0;
  /* 今天若尚未全部完成，从昨天起算 */
  if(dayComplete(d)!==true && dayComplete(d)!=='leave') d = addDays(d,-1);
  while(guard++<1000){
    var r=dayComplete(d);
    if(r===true){ n++; d=addDays(d,-1); }
    else if(r==='leave'||r==='none'){ d=addDays(d,-1); }
    else break;
  }
  return n;
}
function bestStreak(){
  var dates=Object.keys(state.records).sort();
  if(!dates.length) return currentStreak();
  var d=dates[0], end=today(), best=0, cur=0, guard=0;
  while(d<=end && guard++<4000){
    var r=dayComplete(d);
    if(r===true){ cur++; if(cur>best) best=cur; }
    else if(r==='leave'||r==='none'){ /* 保持 */ }
    else cur=0;
    d=addDays(d,1);
  }
  return best;
}
/* 统计：任务key -> 通过次数（用key避免改名后失效） */
function statCounts(){
  var byKey={}, byName={}, course=0, total=0;
  for(var ds in state.records){
    var day=state.records[ds];
    for(var k in day){
      var r=day[k];
      if(r.status!=='approved') continue;
      total++;
      if(k.indexOf('c:')===0) course++;
      byKey[k]=(byKey[k]||0)+1;
      if(r.name) byName[r.name]=(byName[r.name]||0)+1;
    }
  }
  return { byKey:byKey, byName:byName, course:course, total:total };
}
/* 通过任务名查找任务key（在所有日常+课程任务中搜索） */
function findTaskKeyByName(nm){
  if(!nm) return null;
  for(var i=0;i<state.tasks.daily.length;i++){
    if(state.tasks.daily[i].name===nm) return 'd:'+state.tasks.daily[i].id;
  }
  for(var i=0;i<state.tasks.courses.length;i++){
    if(state.tasks.courses[i].name===nm) return 'c:'+state.tasks.courses[i].id;
  }
  return null;
}
function onTimeRate(days){
  days=days||30;
  var d=today(), need=0, ok=0;
  for(var i=0;i<days;i++){
    var ds=addDays(d,-i);
    if(isLeave(ds)) continue;
    if(ds===today()) continue;
    var list=tasksForDate(ds);
    list.forEach(function(t){
      need++;
      var r=rec(ds,t.key);
      if(r && r.status==='approved') ok++;
    });
  }
  return need? Math.round(ok*100/need) : 100;
}
function leaveUsed(mk){ mk=mk||monthKey(today()); var n=0; for(var d in state.leaves){ if(monthKey(d)===mk) n++; } return n; }
function leaveLeft(){ return Math.max(0, S().leaveQuotaPerMonth - leaveUsed()); }

/* ---------------- 荣誉结算 ---------------- */
function honorProgress(def){
  var sc=statCounts();
  if(def.type==='streak') return bestStreak();
  if(def.type==='course') return sc.course;
  if(def.type==='points') return totalEarned();
  if(def.type==='checkin') return sc.total;
  if(def.type==='task'){
    // 优先用 taskKey 匹配，回退用 taskName 匹配（兼容旧存档）
    if(def.taskKey) return sc.byKey[def.taskKey]||0;
    // 通过 taskName 查找对应 key
    var tk=findTaskKeyByName(def.taskName);
    if(tk) return sc.byKey[tk]||0;
    return sc.byName[def.taskName]||0;
  }
  return 0;
}

/* ---------------- 现金台账 ---------------- */
function cashUsed(){ var s=0; state.cash.entries.forEach(function(e){ s+=num(e.amount); }); return Math.round(s*100)/100; }
function cashUsedMonth(mk){ mk=mk||monthKey(today()); var s=0;
  state.cash.entries.forEach(function(e){ if(e.type==='exchange' && monthKey(e.date)===mk) s+=num(e.amount); }); return s; }
function cashLeft(){ return Math.max(0, S().cashAnnualCap - cashUsed()); }
function runCashCycle(){
  var ck = cycleKeyOf(today());
  if(state.cash.cycleKey !== ck){
    state.cash.archive.push({ cycleKey:state.cash.cycleKey, total:cashUsed(), entries:state.cash.entries, closedAt:nowStr() });
    state.cash.cycleKey = ck;
    state.cash.entries = [];
    state.cash.weeksPaid = 0;
    state.cash.anchor = today(); /* 重置后从当日起重新按周累计，不倒补历史 */
    toast('🗓 新年度现金预算已重置，上限恢复 '+S().cashAnnualCap+' 元','ok');
  }
  if(S().autoWeeklyCash){
    var days = Math.floor((parseD(today()) - parseD(state.cash.anchor))/86400000);
    var due = Math.floor(days/7)+1;
    if(due<0) due=0;
    var guard=0;
    while(state.cash.weeksPaid < due && guard++<80){
      if(cashUsed() + num(S().cashWeekly) > S().cashAnnualCap){ break; }
      state.cash.weeksPaid++;
      state.cash.entries.push({ id:uid('cs'), date:today(), type:'weekly', amount:num(S().cashWeekly),
        note:'第'+state.cash.weeksPaid+'周固定线下零花钱' });
    }
  }
}

/* ---------------- 萌宠周补给 + 心情衰减 ---------------- */
function runPetWeekly(){
  var wk=weekKey(today()), got=0;
  if(!state.pets || !Array.isArray(state.pets)){ state.pets=[]; }
  state.pets.forEach(function(p){
    /* 满级周补给 */
    if(p.level >= S().petMaxLevel){
      var k=p.id+'@'+wk;
      if(!state.petMeta.weeklyClaims[k]){
        state.petMeta.weeklyClaims[k]=true;
        addPoints(S().petMaxLevelWeeklyReward, '满级萌宠「'+p.name+'」每周补给', '萌宠');
        got+=S().petMaxLevelWeeklyReward;
      }
    }
    /* 心情衰减：每天没喂心情-5，最低降到10 */
    if(p.lastFed && p.lastFed!==today()){
      var daysSinceFed=Math.floor((parseD(today())-parseD(p.lastFed))/86400000);
      if(daysSinceFed>0){
        var decay=Math.min(daysSinceFed*5, p.mood-10);
        if(decay>0){ p.mood-=decay; }
        if(p.mood<10) p.mood=10;
      }
    }
  });
  if(got) toast('🐾 满级萌宠送来本周补给 +'+got+' '+PN(),'coin');
}

function fieldHTML(f){
  var id='f_'+f.k, v=f.value;
  if(f.type==='check'){
    return '<div class="chkline"><input type="checkbox" id="'+id+'" '+(v?'checked':'')+'><label for="'+id+'">'+esc(f.label)+'</label></div>';
  }
  if(f.type==='select'){
    var o='';
    (f.opts||[]).forEach(function(op){ o+='<option value="'+esc(op.v)+'" '+(String(op.v)===String(v)?'selected':'')+'>'+esc(op.t)+'</option>'; });
    return '<label class="f"><span>'+esc(f.label)+'</span><select id="'+id+'">'+o+'</select></label>';
  }
  if(f.type==='textarea'){
    return '<label class="f"><span>'+esc(f.label)+'</span><textarea id="'+id+'" placeholder="'+esc(f.ph||'')+'">'+esc(v||'')+'</textarea></label>';
  }
  if(f.type==='weekdays'){
    var w='<label class="f"><span>'+esc(f.label)+'</span><div class="wdays">';
    for(var i=0;i<7;i++){
      var d=(i+1)%7; /* 周一开始 */
      w+='<label><input type="checkbox" class="wd_'+f.k+'" value="'+d+'" '+((v||[]).indexOf(d)>=0?'checked':'')+'>'+WD[d]+'</label>';
    }
    return w+'</div></label>';
  }
  return '<label class="f"><span>'+esc(f.label)+'</span><input id="'+id+'" type="'+(f.type||'text')+'" value="'+esc(v==null?'':v)+'" placeholder="'+esc(f.ph||'')+'"></label>';
}
function formHTML(fields){ return fields.map(fieldHTML).join(''); }
function readForm(fields){
  var o={};
  fields.forEach(function(f){
    var id='f_'+f.k;
    if(f.type==='check') o[f.k]=gc(id);
    else if(f.type==='number') o[f.k]=num(gv(id),0);
    else if(f.type==='weekdays'){
      var arr=[]; var els=document.querySelectorAll('.wd_'+f.k);
      for(var i=0;i<els.length;i++) if(els[i].checked) arr.push(Number(els[i].value));
      o[f.k]=arr;
    }
    else o[f.k]=gv(id);
  });
  return o;
}

function genMathQ(){
  var ops=['+','-','×'];
  var op=pick(ops);
  var a,b,ans;
  if(op==='+'){ a=10+Math.floor(Math.random()*40); b=10+Math.floor(Math.random()*40); ans=a+b; }
  else if(op==='-'){ a=20+Math.floor(Math.random()*50); b=5+Math.floor(Math.random()*15); ans=a-b; }
  else { a=2+Math.floor(Math.random()*8); b=2+Math.floor(Math.random()*8); ans=a*b; }
  var opts=[ans],s=new Set([ans]);
  while(opts.length<4){ var w=ans+(-5+Math.floor(Math.random()*11)); if(w<0)w=Math.abs(w); if(!s.has(w)){s.add(w);opts.push(w);} }
  opts.sort(function(){return Math.random()-0.5;});
  return {q:a+' '+op+' '+b+' = ?', answer:ans, options:opts};
}

  {q:'一个数加3等于10，这个数是几？', options:['6','7','8','9'], answer:1},
  {q:'如果有3个苹果，吃掉1个又买2个，现在有几个？', options:['3','4','5','2'], answer:1},
  {q:'哪个不是水果？', options:['苹果','香蕉','土豆','橙子'], answer:2},
  {q:'1,2,4,7,11,? 下一个数是几？', options:['15','16','17','18'], answer:1},
  {q:'一天有几分钟？', options:['600','1200','1440','2400'], answer:2},
  {q:'一个正方形有几条边？', options:['3','4','5','6'], answer:1},
  {q:'哪个数最大？', options:['99','100','101','98'], answer:2}
];
function genQuizQuestions(){
  var math1=genMathQ(), math2=genMathQ();
  var k1=pick(KNOWLEDGE_BANK), k2=pick(KNOWLEDGE_BANK);
  while(k2===k1) k2=pick(KNOWLEDGE_BANK);
  var l1=pick(LOGIC_BANK);
  return [
    [math1, math2],
    [k1, k2],
    [l1]
  ];
}

    h+='<div class="hint" style="margin-top:8px">💡 现金不可反向兑换'+PN()+'，每年 8 月 1 日自动重置。</div>';

  });

        (r.done?'<span class="badge b-ok">已兑现</span>':''))+'</div>';
  });
  return h+'</div></div>';

ACT.doSubmit=function(d){
  var t=taskByKey(d.d,d.k); if(!t) return;
  var complete=gc('cmpl'), note=gv('cnote');
  setRec(d.d,d.k,{ status:'submitted', name:t.name, emoji:t.emoji, type:t.type, submitAt:nowStr(),
    complete:complete, childNote:note, points:0 });
  logIt({ date:d.d, key:d.k, name:t.name, action:'提交打卡', status:'submitted', by:state.profile.childName, note:(complete?'完整完成':'部分完成')+(note?(' / '+note):'') });
  closeModal(); save(); render();
  var tp=renderTpl('submit', t.name);
  showCheckinCelebration({ emoji:tp.emoji, title:tp.title, msg:tp.msg, sub:tp.sub, btn:tp.btn });
};
function grantFor(t){
  if(t.type==='course') return num(t.points, S().coursePoints);
  if(t.type==='daily') return (t.points==null? num(pick(S().dailyPointsPool),2) : num(t.points));
  return num(t.points, S().adhocDefaultPoints);
}
ACT.approve=function(d){
  var r=rec(d.d,d.k); var t=taskByKey(d.d,d.k);
  if(!r||!t) return;
  var pts = r.complete===false? 0 : grantFor(t);
  r.status = r.complete===false? 'partial':'approved';
  r.approveAt = nowStr(); r.points = pts;
  // 防止重复发放积分：只有未发放过时才加分
  if(pts>0 && !r.pointsAwarded){ addPoints(pts, '完成任务「'+t.name+'」（'+d.d+'）', t.typeName); r.pointsAwarded=true; }
  logIt({ date:d.d, key:d.k, name:t.name, action:(pts>0?'审核通过':'部分完成不计分'), status:r.status, by:'家长', points:pts });
  save();
  if(pts>0){
    if(!_silent){ var tp=renderTpl('approve', t.name); showCheckinCelebration({ emoji:tp.emoji, title:tp.title, msg:tp.msg, points:pts, sub:tp.sub, btn:tp.btn }); }
    else toast('🎉 审核通过，发放 '+pts+' '+PN(),'coin');
  } else {
    var tp=renderTpl('partial', t.name);
    showCheckinCelebration({ emoji:tp.emoji, title:tp.title, msg:tp.msg, sub:tp.sub, btn:tp.btn });
  }
  checkAwards(); checkHonors(); maybeSurprise(); save(); render();
};
ACT.approveAll=function(){
  var n=0; _silent=true;
  for(var ds in state.records) for(var k in state.records[ds]){
    if(state.records[ds][k].status==='submitted'){ ACT.approve({d:ds,k:k}); n++; }
  }
  _silent=false;
  toast(n? ('已批量通过 '+n+' 条'):'没有待审核项','ok');
};
ACT.reject=function(d){

var QUIZ_STATE=null;
ACT.startQuiz=function(){
  if(quizPlayedToday()){ toast('今日已闯关，明天再来！','err'); return; }
  QUIZ_STATE={ level:0, qIdx:0, questions:genQuizQuestions(), correct:0, total:0, earned:0, levelCleared:[false,false,false] };
  QUIZ_STATE.total=QUIZ_STATE.questions.reduce(function(a,qs){return a+qs.length;},0);
  renderQuizQuestion();
};
function renderQuizQuestion(){
  var st=QUIZ_STATE;
  if(!st) return;
  var lv=QUIZ_LEVELS[st.level];
  var q=st.questions[st.level][st.qIdx];
  var progress='第'+(st.level+1)+'关 · '+(st.qIdx+1)+'/'+st.questions[st.level].length;
  var body='<div style="text-align:center">'+
    '<div class="hint" style="margin-bottom:4px">'+esc(lv.name)+'</div>'+
    '<div class="badge b-wait" style="margin-bottom:12px">'+progress+'</div>'+
    '<div style="font-size:28px;font-weight:900;margin:16px 0;color:var(--ink)">'+esc(q.q)+'</div>';
  if(q.options){
    body+='<div style="margin-top:14px">';
    q.options.forEach(function(opt,i){
      body+='<button class="btn" style="display:block;width:100%;margin:8px 0;text-align:left;padding:14px 16px;font-size:16px;background:#f8f6ff;border:2px solid #eee9f4;border-radius:14px" data-act="answerQuiz" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(opt)+'</button>';
    });
    body+='</div>';
  }
  body+='</div>';
  openModal('🧠 知识闯关', body, '<button class="btn ghost" data-act="quitQuiz">放弃闯关</button>');
}
ACT.answerQuiz=function(d){
  var st=QUIZ_STATE; if(!st) return;
  var q=st.questions[st.level][st.qIdx];
  var idx=Number(d.i);
  var correct=false;
  if(q.answer!==undefined){ correct=(idx===q.answer); }
  else if(q.options){ correct=(q.options[idx]===q.answer); }
  sfx(correct?'ok':'err');
  /* 显示对错反馈 */
  var lv=QUIZ_LEVELS[st.level];
  var body='<div style="text-align:center">'+
    '<div style="font-size:60px;margin:10px 0">'+(correct?'✅':'❌')+'</div>'+
    '<div style="font-size:22px;font-weight:900">'+(correct?'答对了！':'答错了')+'</div>';
  if(!correct){
    var ansStr = q.answer!==undefined? q.options[q.answer] : q.answer;
    body+='<div class="hint" style="margin-top:8px">正确答案：<b>'+esc(String(ansStr))+'</b></div>';
  }
  body+='<div class="hint" style="margin-top:6px">'+esc(q.q)+'</div></div>';
  var isLast=(st.qIdx>=st.questions[st.level].length-1);
  document.querySelector('.modal .mb').innerHTML=body;
  document.querySelector('.modal .mf').innerHTML='<button class="btn '+(isLast?'g':'p')+'" data-act="nextQuiz">'+(isLast?'查看本关结果':'下一题')+'</button>';
  if(correct) st.correct++;
  st._lastCorrect=correct;
};
ACT.nextQuiz=function(){
  var st=QUIZ_STATE; if(!st) return;
  st.qIdx++;
  if(st.qIdx>=st.questions[st.level].length){
    /* 本关结束 */
    var lv=QUIZ_LEVELS[st.level];
    var allRight=st.questions[st.level].every(function(q,i){ return st._lastCorrect||true; });
    /* 计算本关答对数 */
    var levelCorrect=0;
    /* 重新统计 - 用更简单的方式：每关答对数 */
    st.levelCleared[st.level]=(st.correct>0);
    /* 简化：只要答对就给分 */
    /* 实际奖励：本关答对的题目按比例给分 */
    st.earned+=lv.reward; /* 通关就给奖励 */
    st.level++;
    st.qIdx=0;
    if(st.level>=QUIZ_LEVELS.length){
      /* 全部闯关完毕 */
      finishQuiz();
      return;
    }
    /* 显示本关结果，进入下一关 */
    var body='<div style="text-align:center">'+
      '<div style="font-size:50px;margin:8px">⭐</div>'+
      '<div style="font-size:20px;font-weight:900">第'+st.level+'关通过！</div>'+
      '<div class="creward" style="margin-top:8px">🎁 +'+lv.reward+' '+PN()+'</div>'+
      '<div class="hint" style="margin-top:8px">准备进入'+QUIZ_LEVELS[st.level].name+'</div></div>';
    addPoints(lv.reward,'知识闯关·'+lv.name,'闯关');
    openModal('🧠 知识闯关', body, '<button class="btn p" data-act="contQuiz">继续闯关</button>');
    return;
  }
  renderQuizQuestion();
};
ACT.contQuiz=function(){ renderQuizQuestion(); };
ACT.quitQuiz=function(){
  confirmBox('放弃闯关','已获得的积分会保留，确定放弃吗？','确认放弃',function(){
    QUIZ_STATE=null; closeModal(); render();
  });
};
function finishQuiz(){
  var st=QUIZ_STATE;
  var allClear=(st.correct===st.total);
  if(allClear){ st.earned+=3; addPoints(3,'知识闯关·全通关奖励','闯关'); }
  var result={
    date:today(), ts:nowStr(),
    correct:st.correct, total:st.total,
    earned:st.earned, allClear:allClear
  };
  state.quiz.lastDate=today();

ACT.doBattle=function(){
  var used=battleUsedToday();
  if(used>=S().battleDailyLimit){ toast('今日对战次数已用完','err'); return; }
  if(state.points<S().battleCost){ toast(PN()+'不足','err'); return; }
  addPoints(-S().battleCost, '趣味对战入场', '对战');
  state.battle.daily[today()]=used+1;
  var outs=S().battleOutcomes, tw=0; outs.forEach(function(o){ tw+=num(o.weight); });
  /* 保底机制：连续2次0奖励后，本次必出好结果（排除0奖励档位） */
  var pity=state.battle.pity||0;
  var goodOuts=outs.filter(function(o){ return num(o.reward,0)>0; });
  var hit;
  if(pity>=2 && goodOuts.length>0){
    /* 保底：从好结果中按权重随机 */
    var gtw=0; goodOuts.forEach(function(o){ gtw+=num(o.weight); });
    var gr=Math.random()*gtw, gacc=0;
    hit=goodOuts[goodOuts.length-1];
    for(var i=0;i<goodOuts.length;i++){ gacc+=num(goodOuts[i].weight); if(gr<=gacc){ hit=goodOuts[i]; break; } }
    state.battle.pity=0;
  } else {
    var r=Math.random()*tw, acc=0;
    hit=outs[outs.length-1];
    for(var i=0;i<outs.length;i++){ acc+=num(outs[i].weight); if(r<=acc){ hit=outs[i]; break; } }
    /* 更新保底计数 */
    if(num(hit.reward,0)===0){ state.battle.pity=pity+1; } else { state.battle.pity=0; }
  }
  var rw=num(hit.reward,0);
  if(rw>0) addPoints(rw, '对战结算 · '+hit.key, '对战');
  state.battle.history.unshift({ id:uid('b'), ts:nowStr(), key:hit.key, emoji:hit.emoji, reward:rw, cost:S().battleCost });
  if(state.battle.history.length>500) state.battle.history.length=500;
  save();
  var net=rw-S().battleCost;
  sfx('battle');
  openModal('⚔️ 对战结算',
    '<div style="text-align:center"><div style="font-size:70px">'+hit.emoji+'</div>'+
    '<div style="font-size:24px;font-weight:900;margin-top:4px">'+esc(hit.key)+'</div>'+
    '<div class="hint" style="margin-top:4px">'+esc(hit.text||'')+'</div>'+
    '<div class="badge '+(rw>=S().battleCost?'b-ok':(rw>0?'b-wait':'b-no'))+'" style="margin-top:12px;font-size:14px;padding:8px 16px">'+
      '返还 '+rw+' '+PN()+' · 本局净'+(net>=0?'赚 +':'亏 ')+net+'</div>'+
    '<div class="hint" style="margin-top:10px">今日剩余次数：'+Math.max(0,S().battleDailyLimit-(used+1))+'</div></div>',
    '<button class="btn ghost" data-act="closeModal">收下战报</button>'+
    ((used+1<S().battleDailyLimit && state.points>=S().battleCost)? '<button class="btn p" data-act="doBattle">再战一局</button>':''));
  render();
};

/* -------- 成长周报 -------- */
function weekRange(wk){ return { mon:dstr(parseD(wk)), sun:dstr(parseD(addDays(wk,6))) }; }
function lastWeeklyReport(){ return state.weeklyReports.length? state.weeklyReports[state.weeklyReports.length-1]:null; }
function generateWeeklyReport(){
  var wk=weekKey(today()), rg=weekRange(wk);
  var completed=0, fullDays=0, earned=0, byTask={}, perDay=[];
  for(var i=0;i<7;i++){
    var ds=addDays(wk,i), list=tasksForDate(ds), done=0;
    list.forEach(function(x){
      if(statusOf(ds,x.key)==='approved'){ completed++; done++; earned+=(rec(ds,x.key)||{}).points||0; byTask[x.name]=(byTask[x.name]||0)+1; }
    });
    if(list.length && done===list.length) fullDays++;
    perDay.push({ ds:ds, total:list.length, done:done });
  }
  state.weeklyReports.push({ id:uid('wr'), weekKey:wk, mon:rg.mon, sun:rg.sun, generatedAt:nowStr(),
    fullDays:fullDays, completed:completed, earned:earned, perDay:perDay, byTask:byTask, streak:currentStreak() });
  return lastWeeklyReport();
}
function maybeWeeklyReport(){
  if(new Date().getDay()!==0) return;           /* 仅周日自动生成 */
  var wk=weekKey(today());
  if(state.weeklyReports.some(function(r){ return r.weekKey===wk; })) return;
  var r=generateWeeklyReport(); save();
  showWeeklyReport(r, true);
}
function showWeeklyReport(r, isNew){
  if(!r){ r=lastWeeklyReport(); }
  if(!r){ r=generateWeeklyReport(); save(); }
  var rg=weekRange(r.weekKey), maxd=1;
  r.perDay.forEach(function(d){ if(d.total>maxd) maxd=d.total; });
  var bars='<div class="wk-bars">';
  r.perDay.forEach(function(d){
    var pct=d.total? Math.round(d.done*100/d.total):0;
    bars+='<div class="wk-bar"><div class="wk-col"><i style="height:'+pct+'%"></i></div>'+
      '<div class="wk-lab">'+WD[parseD(d.ds).getDay()].slice(1)+'</div>'+
      '<div class="wk-num">'+(d.total? d.done+'/'+d.total:'—')+'</div></div>';
  });
  bars+='</div>';
  var top='', arr=Object.keys(r.byTask).sort(function(a,b){ return r.byTask[b]-r.byTask[a]; }).slice(0,5);
  arr.forEach(function(n){ top+='<div class="kv"><span>'+esc(n)+'</span><b>'+r.byTask[n]+' 次</b></div>'; });
  var body='<div class="hint">📅 统计周期：'+rg.mon+' ~ '+rg.sun+'（周一至周日）</div>'+
    '<div class="grid g3" style="margin:12px 0">'+
      tile('t-green','全勤天数', r.fullDays+' / 7','本周','✅')+
      tile('t-yellow','完成任务', r.completed+' 次','累计','📚')+
      tile('t-pink','获得'+PN(), r.earned+'','本周','⭐')+
    '</div>'+ bars +
    (top? '<div class="card soft" style="margin-top:12px"><h3>🌟 本周最爱任务</h3>'+top+'</div>':'')+
    '<div class="hint" style="margin-top:8px">当前连续全勤 '+r.streak+' 天 · 报告已永久保存，可在「积分中心 → 成长周报」查看历史。</div>';
  openModal((isNew?'📝 本周成长周报已生成！':'📝 成长周报'), body,
    '<button class="btn g" data-act="closeModal">'+(isNew?'收下周报':'关闭')+'</button>');
}
